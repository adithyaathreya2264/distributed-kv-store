plugins {
    id 'application'
}

dependencies {
    implementation project(':modules:raft-core')
    implementation project(':modules:networking')
    implementation project(':modules:storage-engine')
    implementation 'com.google.protobuf:protobuf-java:3.25.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.dkv.server.DKVServer'
}

// com.sun.net.httpserver lives in the jdk.httpserver module.
// Explicitly exporting it silences the IDE "restricted API" warning and is
// the correct way to use the built-in HTTP server on Java 9+.
compileJava {
    options.compilerArgs += [
        '--add-exports', 'jdk.httpserver/sun.net.httpserver=ALL-UNNAMED'
    ]
}

// The same flag must be present at runtime so the JVM module system allows
// reflective access to the internal package.
run {
    jvmArgs '--add-exports=jdk.httpserver/sun.net.httpserver=ALL-UNNAMED'
}

test {
    useJUnitPlatform()
}
